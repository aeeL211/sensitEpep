name: Build plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile (arm64 + arm)
        run: |
          set -e
          BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p out/system/bin out/webroot
          for t in aarch64-linux-android24:arm64 armv7a-linux-androideabi24:arm; do
            $BIN/${t%%:*}-clang++ -O2 -DNDEBUG -Wall -Wextra -s \
              -static-libstdc++ \
              -fno-exceptions -fno-rtti -fvisibility=hidden \
              -ffunction-sections -fdata-sections -Wl,--gc-sections \
              flick.cpp -o out/system/bin/flick.${t##*:}
          done
          file out/system/bin/flick.*
          ls -l out/system/bin
      - name: Verify no extra shared libraries
        run: |
          set -e
          READELF=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for f in out/system/bin/flick.*; do
            $READELF -d $f | grep NEEDED || true
            if $READELF -d $f | grep NEEDED | grep -vE 'lib(c|m|dl)\.so'; then
              echo "::error::$f depends on a library that does not exist on the phone"
              exit 1
            fi
          done
      - name: Stage module
        run: |
          set -e
          cp module.prop customize.sh uninstall.sh hw.sh out/
          cp index.html out/webroot/
          sed -i 's/\r$//' out/module.prop out/*.sh  # crlf breaks module.prop
          chmod 755 out/*.sh out/system/bin/flick.*
      - name: Package
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2)
          cd out && zip -r ../Flick-$VER.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Flick
          path: Flick-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flick-*.zip
